title: "{{addlevel_confirm_title}}"
size: 3
items:
  cancel:
    pos: 1,2
    material: red_stained_glass_pane
    display_name: "<#fc0000>{{addlevel_confirm_cancel}}"
    lore:
      - '<gray>Cancel this action?'
      - '<gray>No levels will be applied.'
      - ''
      - '<#fc0000>→ Click to cancel'
  info:
    pos: 1,4
    material: book
    display_name: "<gold>{{addlevel_confirm_info_name}}"
    lore:
      - "<gray>{{addlevel_confirm_player}}: <white>{player}"
      - "<gray>{{addlevel_confirm_skill}}: <aqua>{skill}"
      - "<gray>{{addlevel_confirm_current}}: <white>{current_level}"
      - "<gray>{{addlevel_confirm_new}}: <green>{new_level}"
      - "<gray>{{addlevel_confirm_wasted}}: <red>{wasted}"
      - " "
      - "<yellow>{{addlevel_confirm_info_click}}"
  confirm:
    pos: 1,6
    material: lime_stained_glass_pane
    display_name: "<#00fc00>{{addlevel_confirm_confirm}}"
    lore:
      - '<gray>Are you sure that you want to apply this level?'
      - '<gray>This action is irreversible!'
      - ''
      - '<#00fc00>→ Click to apply level'
